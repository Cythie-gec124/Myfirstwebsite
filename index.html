<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cythie</title>

<style>
@font-face {
    font-family: "Fleur De Leah Offline";
    src: url("fonts/FleurDeLeah-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}


.circle-frame {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  overflow: hidden;
  border: 5px solid #fff;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
}

.circle-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

body {
    padding: 24px;  
    color: #1b1b1f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;       
    margin: 0;               
}

#greeting {
    color: #ffffff;
    font-family: "Fleur De Leah Offline", cursive; 
    font-size: 4rem;
    margin-top: 0;
    margin-bottom: 10px;
}

#Pass {
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;
    width: 550px;
    height: 400px;
    border: 3px solid rgb(0, 87, 128); 
    border-radius: 25px;
    background-color: #516c95;
} 

#passInput {
    padding: 6px 12px;
    border-radius: 20px;
    border: 2px solid #ffffff;
    background-color: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    text-align: center;
    outline: none;
    margin-bottom: 10px;
    font-size: 14px;
}

#passInput::placeholder {
    color: #d0d0d0;
}

button {
    padding: 8px 16px;
    border-radius: 50px;
    border: 1px solid #d1d5db;
    background-color: rgb(0, 87, 128;
    cursor: pointer;

}
</style>
    </head>
    <body>
        <div id="Pass">
            <h1 id="greeting">Welcome!</h1>
            	<div class="circle-frame">
                    <img src="images/User.jpg" alt="User Profile">
                </div>
		<p style="font-family: Arial, sans-serif; font-size: 20px; font-weight: 800; color: #ffffff;">USER</p>
		<input type="password" id="passInput" placeholder="Password: Blueberry" />
		<button id="btn"; style="font-size: 15px; font-weight: 800; color: #516c95;">ENTER</button>
		
		<script src="script.js"></script>
        </div>
    </body>

<script>
document.getElementById("btn").addEventListener("click", function () {
    const passInput = document.getElementById("passInput");

    if (passInput.value === "Blueberry") {
        window.location.href = "home.html";
    } else {
        alert("Incorrect password!");
        passInput.value = "";
    }
});
</script>

</html>
